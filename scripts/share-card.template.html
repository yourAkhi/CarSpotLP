<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172842">
  <meta name="color-scheme" content="light">
  <title>{{vehicle}} von {{owner}} · {{serial}} · CarSpot ID</title>
  <meta name="description" content="{{fullVehicle}} von {{owner}} auf der Pearl-Carbon-Karte {{serial}}.">
  <link rel="canonical" href="{{profileUrl}}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="de_DE">
  <meta property="og:site_name" content="CarSpot">
  <meta property="og:title" content="{{vehicle}} von {{owner}} · {{serial}}">
  <meta property="og:description" content="{{fullVehicle}} von {{owner}} auf der Pearl-Carbon-Karte {{serial}}.">
  <meta property="og:url" content="{{profileUrl}}">
  <meta property="og:image" content="{{shareImageUrl}}">
  <meta property="og:image:width" content="{{width}}">
  <meta property="og:image:height" content="{{height}}">
  <meta property="og:image:alt" content="{{alt}}">
  <link rel="icon" type="image/png" href="/assets/carspot-favicon.png">
  <link rel="preload" as="image" href="/assets/share-card/navy-satin.webp">
  <link rel="preload" as="image" href="/assets/share-card/pearl-carbon.webp">
  <script src="/image-ready.js?v=2"></script>
  <link rel="stylesheet" href="/id/share-card.css?v=3">
  <script src="/id/share-card.js?v=2" defer></script>
</head>
<body class="share-card-page">
  <header class="card-header">
    <div class="card-header-inner">
      <a class="card-brand" href="/" aria-label="CarSpot – zur Startseite">
        <img src="/assets/share-card/carspot-id.png" width="292" height="32" alt="CarSpot ID">
      </a>
      <span class="card-header-divider" aria-hidden="true"></span>
      <button class="card-share" type="button" id="share-button" aria-label="Share Card teilen" title="Share Card teilen">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" aria-hidden="true">
          <circle cx="18" cy="5" r="3"/><circle cx="5" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <path d="m7.7 10.6 7.6-4.2m-7.6 7 7.6 4.2"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="card-surface" style="--native-width: {{width}}px; --height-per-width: calc({{height}} / {{width}})">
    <main class="card-group" aria-labelledby="card-label">
      <h1 class="card-label" id="card-label"><span>SHARE CARD</span> <span class="card-serial">{{serial}}</span></h1>
      <figure class="card-artwork">
        <img src="{{imageUrl}}" width="{{width}}" height="{{height}}" fetchpriority="high" alt="{{alt}}">
        {{detailsAction}}
      </figure>
    </main>

    <footer class="card-footer">
      <nav aria-label="Rechtliches und Kontakt">
        <a href="/impressum.html">Impressum</a>
        <span aria-hidden="true"></span>
        <a href="/datenschutz.html">Datenschutz</a>
        <span aria-hidden="true"></span>
        <a href="{{reportUrl}}">Melden</a>
      </nav>
    </footer>
  </div>

  {{detailsDialog}}
  <dialog class="card-dialog" id="copy-dialog" aria-labelledby="copy-title">
    <h2 id="copy-title">Link kopieren</h2>
    <label for="share-url">Diesen Link kannst du auswählen und kopieren.</label>
    <input type="url" id="share-url" readonly autofocus>
    <form method="dialog"><button>Schließen</button></form>
  </dialog>
  <div class="card-status" id="share-status" role="status" aria-live="polite"></div>
</body>
</html>
